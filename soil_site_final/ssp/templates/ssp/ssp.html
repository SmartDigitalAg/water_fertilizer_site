<!DOCTYPE html>
{% load static %}
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>미래 기후데이터</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/ol@v8.2.0/ol.css">
  <link rel="stylesheet" href="{% static 'ssp/css/ssp.css' %}">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@3.9.1/dist/chart.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
</head>
<body>
  <div class="container">
    <nav>
      <a class="nav-link" href="{% url 'main-index' %}">홈</a> |
      <span class="nav-menu">
        <a class="nav-link" href="javascript:void(0)">물사용처방</a> |
        <div class="dropdown-content">
          <a class="dropdown-link" href="{% url 'water:water' %}">물사용처방</a>
          <a class="dropdown-link" href="{% url 'ssp:ssp' %}">미래 기후데이터</a>
        </div>
      </span>
      <span class="nav-menu">
        <a class="nav-link" href="javascript:void(0)">비료사용처방</a>
        <div class="dropdown-content">
          <a class="dropdown-link" href="{% url 'fertilizer:prescription' %}">비료사용처방</a>
          <a class="dropdown-link" href="{% url 'fertilizer:experience' %}">비료사용처방 체험하기</a>
          <a class="dropdown-link" href="{% url 'fertilizer:standard' %}">비료 표준사용량 처방</a>
        </div>
      </span>
    </nav>

    <h1>미래 기후데이터</h1>

    <div class="category_top_group">
      <div class="category_line">
        <label class="category_title">· 작물분류</label>
        <select class="category_select_box" id="cropCategory">
          <option value="grain">곡류</option>
          <!-- <option value="leafy">엽채류</option>
          <option value="oil">유지작물</option>
          <option value="root">서류</option>
          <option value="fruit_tree">과수</option>
          <option value="root_veg">근채류</option>
          <option value="fruit_veg">과채류</option>
          <option value="bulb">인경채류</option> -->
        </select>
      </div>
      <div class="category_line">
        <label class="category_title">· 작물</label>
        <select class="category_select_box" id="cropType">
          <option value="보리">보리</option>
          <option value="밀">밀</option>
        </select>
      </div>
      <span class="category_blit"></span>
      <div class="category_btn_group">
        <button type="button" class="category_btn_action" data-id="ssp1">SSP1-2.6</button>
        <button type="button" class="" data-id="ssp2">SSP2-4.5</button>
        <button type="button" class="" data-id="ssp3">SSP3-7.0</button>
        <button type="button" class="" data-id="ssp5">SSP5-8.5</button>
      </div>
      <div class="model_name_display">
        <span class="model_label">모델:</span>
        <span class="model_value">KACE-1-0-G</span>
      </div>
    </div>

    <div class="map-section">
      <h2 class="section-title">기후변화 시나리오 지도</h2>

      <div class="map-container">
        <div class="left-map">
          <div id="mainMap" class="map-box"></div>
          <div class="legend" id="legend" style="display: none;">
            <div class="legend-title">물 필요량 (mm)</div>
            <div class="legend-items" id="legendItems"></div>
          </div>
        </div>
        <div class="right-content">
          <div class="period-select-wrapper">
            <div class="period_btn_group">
              <button type="button" class="category_btn" data-period="early">전반기 (2026-2040)</button>
              <button type="button" class="category_btn" data-period="mid">중반기 (2041-2070)</button>
              <button type="button" class="category_btn category_btn_action" data-period="late">후반기 (2071-2100)</button>
            </div>
          </div>
          <div class="right-maps">
            <div class="small-map-item">
              <h3>SSP1-2.6</h3>
              <div id="map1" class="map-box small"></div>
            </div>
            <div class="small-map-item">
              <h3>SSP2-4.5</h3>
              <div id="map2" class="map-box small"></div>
            </div>
            <div class="small-map-item">
              <h3>SSP3-7.0</h3>
              <div id="map3" class="map-box small"></div>
            </div>
            <div class="small-map-item">
              <h3>SSP5-8.5</h3>
              <div id="map4" class="map-box small"></div>
            </div>
          </div>
          <div class="chart-area">
            <h3 class="chart-title">지역별 비교</h3>
            <div class="chart-content">
              <canvas id="barChart"></canvas>
            </div>
          </div>
        </div>
      </div>

      <div class="year-slider-container">
        <div class="year-slider-wrapper">
          <button class="play-button" id="playButton">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
              <circle cx="12" cy="12" r="10" fill="#4A90E2"/>
              <path d="M10 8l6 4-6 4V8z" fill="white"/>
            </svg>
          </button>
          <div class="slider-track">
            <span class="year-label start-year">2026</span>
            <input type="range" id="yearSlider" min="2026" max="2100" value="2026" step="1">
            <span class="year-label end-year">2100</span>
          </div>
          <div class="current-year-display" id="currentYearDisplay">2026년</div>
        </div>
      </div>

      <div class="data-select-container">
        <h2 class="section-title">노지 밭 물사용 처방</h2>
        <div class="data-select-wrapper">
          <div class="select-group">
            <label class="select-label">지점</label>
            <select class="data-select-box" id="station">
              <option value="">선택하세요</option>
            </select>
          </div>
          <button class="load-data-btn" id="loadDataBtn">검색</button>
        </div>

        <div class="data-display-container" id="dataDisplay" style="display: none;">
{#          <h3 class="data-display-title">데이터 조회 결과</h3>#}
          <div class="data-info" id="dataInfo"></div>
          <div class="data-table-wrapper">
            <table class="data-table">
{#              <thead>#}
{#                <tr>#}
{#                  <th>기후요소</th>#}
{#                  <th>값</th>#}
{#                </tr>#}
{#              </thead>#}
              <tbody id="dataTableBody"></tbody>
            </table>
          </div>
        </div>
      </div>
      <!-- 미래 기후데이터 표출 섹션 -->
      <div class="data-select-container" style="margin-top: 40px;">
        <h2 class="section-title">미래 기후데이터</h2>

        <div class="climate-input-section">
          <div class="climate-select-row">
            <div class="select-group">
              <label class="select-label">작물분류</label>
              <select class="data-select-box" id="climateCropCategory">
                <option value="grain">곡류</option>
              </select>
            </div>

            <div class="select-group">
              <label class="select-label">작물</label>
              <select class="data-select-box" id="climateCropType">
                <option value="보리">보리</option>
                <option value="밀">밀</option>
              </select>
            </div>

            <div class="select-group">
              <label class="select-label">지점</label>
              <select class="data-select-box" id="climateStation">
                <option value="">선택하세요</option>
              </select>
            </div>

            <div class="select-group">
              <label class="select-label">생육단계</label>
              <select class="data-select-box" id="climateGrowthStage">
                <option value="seedling">유묘기(평균기온)</option>
                <option value="tillering">분얼기(평균기온)</option>
                <option value="regrowth">생육재생기(평균기온)</option>
                <option value="elongation">분얼 및 신장기(평균기온)</option>
                <option value="heading_ripening">출수 및 등숙기(평균기온)</option>
              </select>
            </div>
          </div>

          <div class="climate-scenario-row">
            <label class="select-label">시나리오</label>
            <div class="category_btn_group">
              <button type="button" class="category_btn_action" data-scenario="ssp126">SSP1-2.6</button>
              <button type="button" class="" data-scenario="ssp245">SSP2-4.5</button>
              <button type="button" class="" data-scenario="ssp370">SSP3-7.0</button>
              <button type="button" class="" data-scenario="ssp585">SSP5-8.5</button>
            </div>
            <button class="load-data-btn" id="loadClimateDataBtn" style="margin-left: 20px; height: 30px; padding: 6px 16px; font-size: 14px; display: flex; align-items: center; justify-content: center;">조회</button>
          </div>
        </div>

        <div class="climate-chart-container" id="climateChartContainer" style="display: none; margin-top: 30px;">
          <div class="data-info" id="climateDataInfo" style="margin-bottom: 20px;"></div>
          <canvas id="trendsChart" style="width: 100%; height: 400px;"></canvas>
        </div>
      </div>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/ol@v8.2.0/dist/ol.js"></script>
  <script src="{% static 'ssp/js/ssp.js' %}"></script>
</body>
</html>
